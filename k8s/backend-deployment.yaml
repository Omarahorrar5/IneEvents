apiVersion: apps/v1
kind: Deployment
metadata:
  name: ineevents-backend
  labels:
    app: ineevents-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ineevents-backend
  template:
    metadata:
      labels:
        app: ineevents-backend
    spec:
      containers:
      - name: backend
        image: omarahorrar/ineevents-ineserver:latest
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: SUPABASE_URL
          valueFrom:
            configMapKeyRef:
              name: ineevents-config
              key: supabase-url
        - name: SUPABASE_KEY
          valueFrom:
            secretKeyRef:
              name: ineevents-secrets
              key: supabase-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
      imagePullSecrets:
      - name: dockerhub-secret