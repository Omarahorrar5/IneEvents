apiVersion: apps/v1
kind: Deployment
metadata:
  name: ineevents-frontend
  labels:
    app: ineevents-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ineevents-frontend
  template:
    metadata:
      labels:
        app: ineevents-frontend
    spec:
      containers:
      - name: frontend
        image: omarahorrar/ineevents-ineclient:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
