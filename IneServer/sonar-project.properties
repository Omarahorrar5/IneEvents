# ========================================
# SonarQube Configuration for Backend
# ========================================

sonar.projectKey=ineevents-backend
sonar.projectName=IneEvents Backend
sonar.projectVersion=1.0

# Analyze everything in IneServer
sonar.sources=.

sonar.exclusions=\
  node_modules/**,\
  coverage/**,\
  dist/**,\
  build/**,\
  **/*.spec.js,\
  **/*.test.js,\
  **/tests/**,\
  **/.env,\
  **/.env.*,\
  **/Dockerfile,\
  **/*.md

sonar.sourceEncoding=UTF-8
