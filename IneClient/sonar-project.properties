# ========================================
# SonarQube Configuration for Frontend
# ========================================

sonar.projectKey=ineevents-frontend
sonar.projectName=IneEvents Frontend
sonar.projectVersion=1.0

# Vue.js source files
sonar.sources=src

# Exclusions
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  build/**,\
  coverage/**,\
  public/**,\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/*.test.js,\
  **/*.test.ts,\
  **/tests/**,\
  **/.env,\
  **/.env.*,\
  **/*.md

sonar.sourceEncoding=UTF-8
