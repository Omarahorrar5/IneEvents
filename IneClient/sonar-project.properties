# ========================================
# SonarQube Configuration for Frontend
# ========================================

# Project Identification
sonar.projectKey=ineevents-frontend
sonar.projectName=IneEvents Frontend
sonar.projectVersion=1.0

# Source Code Location
# Vue.js source files
sonar.sources=src

# Files to Exclude from Analysis
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  build/**,\
  coverage/**,\
  public/**,\
  **/*.spec.js,\
  **/*.spec.ts,\
  **/*.test.js,\
  **/*.test.ts,\
  **/tests/**

# Test Files (if separate)
# sonar.tests=src/tests

# Test Coverage Reports
# If using Vitest or Jest
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Character Encoding
sonar.sourceEncoding=UTF-8

# Vue.js specific
# SonarQube will analyze .vue files as JavaScript/TypeScript
sonar.language=js